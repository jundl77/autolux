repos:
  - repo: local
    hooks:
      - id: python-format
        name: Python formatting (Ruff)
        entry: uv run --no-sync --locked --extra dev ruff format
        language: system
        types: [python]
        files: ^(autolux|cli|proto|tools)/
        exclude: ^autolux/training/data/
        require_serial: true
      - id: python-lint
        name: Python lint (Ruff)
        entry: uv run --no-sync --locked --extra dev ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: proto-format
        name: Protobuf formatting (clang-format)
        entry: uv run --no-sync --locked --extra dev clang-format -i --style=file
        language: system
        types: [proto]
        files: ^proto/
        require_serial: true
      - id: rust-format
        name: Rust formatting (rustfmt)
        entry: cargo fmt --all
        language: system
        files: ^((starfire|radius)/.*\.rs|rustfmt\.toml|rust-toolchain\.toml)$
        pass_filenames: false
        require_serial: true
