[package]
name = "radius"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Synchronized audio and DMX transport for Autolux"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
core_affinity = "0.8"
cpal = "0.18.2"
crossbeam-queue = "0.3.14"
ctrlc = { version = "3.5", features = ["termination"] }
libftd2xx = { version = "0.33.1", features = ["static"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
