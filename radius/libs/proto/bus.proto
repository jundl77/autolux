syntax = "proto3";

package Radius.Bus;
option optimize_for = LITE_RUNTIME;

// One complete UDP datagram, at most 1200 bytes. Protocol v2 replaces the old
// Radius header; TX and RX must be upgraded together. No service or RPC layer.
message Envelope {
  uint32 protocol_version = 1;
  fixed64 session_id = 2;             // Nonzero, exact 64-bit session identifier.
  fixed64 audio_frame_watermark = 3;  // First stereo frame on the session clock.
  fixed32 sequence = 4;               // Per media kind; wraps modulo 2^32.
  oneof payload {
    Audio audio = 10;
    Lighting lighting = 11;
    Heartbeat heartbeat = 12;
    ReceiverTelemetry receiver_telemetry = 13;
  }
}

message Audio {
  uint32 sample_rate_hz = 1;                               // Exactly 44100.
  uint32 channel_count = 2;                                // Exactly 2, left then right.
  repeated float interleaved_samples = 3 [packed = true];  // 1..128 finite stereo frames.
}

message Lighting {
  bytes channels = 1;  // Exactly 512 DMX channel values, scheduled at the envelope watermark.
}

message Heartbeat {}

// Counters stay integers. Optional ages distinguish missing input from zero age.
// Units and names match the dashboard's local health.json boundary.
message ReceiverTelemetry {
  bool up = 1;
  bool link_up = 2;
  double heartbeat_age_seconds = 3;
  uint64 heartbeats_sent = 4;
  uint64 heartbeats_received = 5;
  double audio_buffer_seconds = 6;
  double buffer_target_seconds = 7;
  uint64 underruns_total = 8;
  uint64 device_underruns_total = 9;
  uint64 concealed_frames_total = 10;
  uint64 lost_frames_total = 11;
  uint64 overflow_frames_total = 12;
  uint64 late_packets_total = 13;
  uint64 latency_trims_total = 14;
  sint32 clock_correction_ppm = 15;
  bool dmx_connected = 16;
  uint64 dmx_frames_total = 17;
  uint64 dmx_dropped_total = 18;
  double dmx_lateness_seconds = 19;
  optional double audio_input_age_seconds = 20;
  optional double audio_max_gap_seconds = 21;
  float audio_signal_peak = 22;
  uint64 invalid_packets_total = 23;
  uint64 send_failures_total = 24;
}
