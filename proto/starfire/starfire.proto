syntax = "proto3";

package autolux.starfire;

import "proto/starfire/rig.proto";

// CLIENT = Autolux coordinator; SERVER = its owned Starfire process.
// Frame: one byte MessageType, four-byte big-endian payload length, then the
// standalone Protobuf message (at most 4 MiB, sized for Login: rig, GDTF profiles and
// the whole Lua library; each AutoloopDefinition.lua_source is at most 64 KiB).
// Larger declared lengths are rejected before allocation. No message envelope.
// Login comes first. Commands apply in order at render boundaries after login.
// A successful Login binds the connection to its nonzero run_id; it cannot be replaced.
// Later commands and heartbeats implicitly belong to that run.
// Command IDs increase within the session; only Login has a success reply.
// Rejections use ErrorReply. Metrics report the last processed command ID.
// Both endpoints send heartbeats every 10 seconds; timeout is 30 seconds.

// Build constants, not a wire field.
// Major changes are incompatible; minor additions are compatible.
enum ProtocolVersion {
  PROTOCOL_MINOR = 0;
  PROTOCOL_MAJOR = 1;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  LOGIN_REPLY = 2;
  PLAY_AUTOLOOP = 3;
  ERROR_REPLY = 4;
  SET_ACTIVE_EFFECT = 5;
  UNSET_ACTIVE_EFFECT = 7;
  UPDATE_BEAT = 9;
  SET_PARAMETER = 11;
  HEARTBEAT = 13;
  METRICS = 14;
  DISCARD_DELAYED_AUDIO = 15;
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  OUTPUT_BRIGHTNESS = 1;     // Number, 0..1; final output multiplier.
  ANIMATION_SPEED = 2;       // Number, 0..8; independent of beat phase.
  OUTPUT_BLACKOUT = 3;       // Boolean; final darkness gate.
  AUDIO_RMS_NORMALIZED = 4;  // Number, 0..1; missing measurements remain unknown.
  // Boolean; freezes musical, animation and script time so the current frame holds,
  // and releases strobes. Overrides timed in seconds keep expiring on wall time; beat
  // lifetimes hold. UpdateBeat is ignored while paused; resume continues from the
  // held position and the next UpdateBeat re-anchors phase, which only moves forward.
  PAUSED = 5;
  DEFAULT_CROSSFADE_BEATS = 6;  // Number, 0..1024; PlayAutoloop without a transition. 0 cuts.
  STROBE_MAX_RATE_HZ = 7;       // Number, 0..10; caps every strobe, effect or script.
  // Number, >0..60; a fixture strobing longer than this is released until its strobe stops.
  STROBE_MAX_BURST_SECONDS = 8;
}

// [CLIENT -> SERVER]
// Supply the complete controller-owned setup for one session; no server-side paths.
// Failure releases partially acquired resources. Asset edits require a new session.
message Login {
  uint64 command_id = 1;
  RigDefinition rig = 2;
  repeated AutoloopDefinition autoloops = 3;
  oneof output {
    string artnet_destination = 4;  // IPv4:port, for direct Art-Net output.
    RadiusOutput radius = 10;       // Embedded audio/lighting transmitter.
  }
  repeated Parameter parameters = 6;
  uint32 protocol_major = 7;  // Must match the server's major version.
  uint32 protocol_minor = 8;  // Backwards-compatible additions within this major.
  fixed64 run_id = 9;         // Shared Autolux/Radius/Starfire run; unrelated to replay seeds.
  optional uint32 render_core = 11;  // Logical CPU index; omitted leaves OS scheduling enabled.

  message RadiusOutput {
    string receiver_address = 1;  // IPv4:TCP port.
    string capture_device_id = 2;
    double playback_delay_seconds = 3;  // Analysis look-ahead, applied once to capture.
    uint32 receiver_buffer_ms = 4;
    uint32 universe = 5;
    optional uint32 network_core = 6;
    bool receiver_audio_enabled = 8;
    bool receiver_lighting_enabled = 9;
  }
}

// [SERVER -> CLIENT]
// The supplied rig, scripts, parameters and output are initialized and ready.
message LoginReply {
  uint64 command_id = 1;
  uint32 frame_rate_hz = 3;
  uint32 max_message_bytes = 4;
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;  // Negotiated minimum of client and server minor versions.
  fixed64 run_id = 7;
}

// [SERVER -> CLIENT]
message ErrorReply {
  uint64 command_id = 1;
  string message = 2;
}

// [CLIENT -> SERVER]
// One autoloop plays at a time; repeating its identity never restarts it.
// An empty ID enters idle, clears effects and outputs darkness.
message PlayAutoloop {
  uint64 command_id = 1;
  string autoloop_id = 2;
  // Omitted uses DEFAULT_CROSSFADE_BEATS (cut until set); idle accepts no transition.
  Transition transition = 4;

  message Transition {
    optional double crossfade_beats = 1;  // Absent means cut; otherwise positive.
  }
}

// [CLIENT -> SERVER]
// Replace this identified effect. Only specified properties override the baseline.
// Higher priority wins; ties use command order. Brightness/blackout parameters apply last.
message SetActiveEffect {
  message RgbColor {
    double red = 1;  // Each channel is normalized to 0..1.
    double green = 2;
    double blue = 3;
  }

  // Physical values use GDTF units; presets name a ChannelSet.
  message AttributeValue {
    oneof value {
      double number = 1;
      string preset = 2;
    }
  }

  uint64 command_id = 1;
  string effect_id = 2;
  oneof target {  // Omitted targets all fixtures.
    string group = 3;
    string fixture = 4;
  }
  optional double intensity = 5;  // 0..1.
  RgbColor colour = 6;
  optional double pan = 7;        // 0..1.
  optional double tilt = 8;       // 0..1.
  optional double strobe_hz = 9;  // 0..10.
  sint32 priority = 10;
  optional double duration_seconds = 11;  // Positive; absent lasts until unset.
  // GDTF attribute, Geometry.Attribute or full function path.
  map<string, AttributeValue> attributes = 12;
}

// [CLIENT -> SERVER]
message UnsetActiveEffect {
  uint64 command_id = 1;
  string effect_id = 2;  // Removing an absent ID does nothing.
}

// [CLIENT -> SERVER]
// The source stopped: silence the capture already held for the playback delay.
// The receiver keeps a contiguous stream and plays silence; capture taken after
// this command is audible one playback delay later. No effect on lighting or
// on an Art-Net output.
message DiscardDelayedAudio {
  uint64 command_id = 1;
}

// [CLIENT -> SERVER]
// Starfire interpolates musical position between updates, independently of animation speed.
message UpdateBeat {
  uint64 command_id = 1;
  double position_beats = 2;
  double tempo_bpm = 3;
}

// [CLIENT -> SERVER]
message SetParameter {
  uint64 command_id = 1;
  Parameter parameter = 2;  // One global setting; other values remain unchanged.
}

// [CLIENT -> SERVER] [SERVER -> CLIENT]
message Heartbeat {}  // Independent liveness signal; no echo or command ID.

// [SERVER -> CLIENT]
message Metrics {
  double elapsed_seconds = 1;
  uint64 rendered_frames = 2;
  uint64 missed_render_deadlines = 3;
  uint32 queued_commands = 4;
  double last_render_duration_seconds = 5;
  string active_bank = 6;
  string active_autoloop = 7;
  string script_error = 8;
  string runtime_error = 9;
  uint64 last_processed_command_id = 10;  // Includes accepted and rejected commands.
  fixed64 run_id = 11;
}

// Supplied source is sandboxed and bounded by Starfire; no file loading at runtime.
message AutoloopDefinition {
  string autoloop_id = 1;  // Unique across all banks; PlayAutoloop uses only this ID.
  string bank = 2;         // Grouping metadata.
  string lua_source = 3;
}

// Shared by initialization and runtime updates. Independent of the active autoloop.
message Parameter {
  ParameterType type = 1;
  oneof value {
    double number = 2;
    bool boolean = 3;
  }
  // OUTPUT_BRIGHTNESS only: linear ease from the current level over wall-clock seconds,
  // not beats, so fades also complete in silence. 0 is instant; must be finite and >= 0.
  double fade_seconds = 4;
}
