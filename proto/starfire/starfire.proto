syntax = "proto3";

package autolux.starfire;

// CLIENT = Autolux coordinator; SERVER = its owned Starfire process.
// Frame: one byte MessageType, four-byte big-endian payload length, then the
// standalone Protobuf message (at most 64 KiB). No message envelope.
// Login comes first. Commands apply in order at render boundaries after login.
// Command IDs increase within the session; replies echo the ID. Empty error = success.
// Both endpoints send heartbeats every 10 seconds; timeout is 30 seconds.

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  LOGIN_REPLY = 2;
  PLAY_SEQUENCE = 3;
  PLAY_SEQUENCE_REPLY = 4;
  SET_ACTIVE_EFFECT = 5;
  SET_ACTIVE_EFFECT_REPLY = 6;
  UNSET_ACTIVE_EFFECT = 7;
  UNSET_ACTIVE_EFFECT_REPLY = 8;
  UPDATE_BEAT = 9;
  UPDATE_BEAT_REPLY = 10;
  SET_PARAMETER = 11;
  SET_PARAMETER_REPLY = 12;
  HEARTBEAT = 13;
  METRICS = 14;
}

// [CLIENT -> SERVER]
// Initialize one owned session. Failure releases partially acquired resources.
message Login {
  uint64 command_id = 1;
  string rig_path = 2;
  string sequences_path = 3;
  string artnet_destination = 4;  // IPv4:port.
  bool broadcast = 5;
  repeated Parameter parameters = 6;
}

// [SERVER -> CLIENT]
message LoginReply {
  uint64 command_id = 1;
  string error = 2;
  uint32 frame_rate_hz = 3;
  uint32 max_message_bytes = 4;
}

// [CLIENT -> SERVER]
// One sequence plays at a time; repeating its identity never restarts it.
// Both names empty enters idle, clears effects and outputs darkness.
message PlaySequence {
  uint64 command_id = 1;
  string bank = 2;
  string sequence = 3;
  Transition transition = 4;  // Omitted means cut; idle accepts no transition.

  message Transition {
    optional double crossfade_beats = 1;  // Absent means cut; otherwise positive.
  }
}

// [SERVER -> CLIENT]
message PlaySequenceReply {
  uint64 command_id = 1;
  string error = 2;
}

// [CLIENT -> SERVER]
// Replace this identified effect. Only specified properties override the baseline.
// Higher priority wins; ties use command order. Brightness/blackout parameters apply last.
message SetActiveEffect {
  uint64 command_id = 1;
  string effect_id = 2;
  oneof target {  // Omitted targets all fixtures.
    string group = 3;
    string fixture = 4;
  }
  optional double intensity = 5;  // 0..1.
  RgbColor colour = 6;
  optional double pan = 7;        // 0..1.
  optional double tilt = 8;       // 0..1.
  optional double strobe_hz = 9;  // 0..10.
  sint32 priority = 10;
  optional double duration_seconds = 11;  // Positive; absent lasts until unset.
}

// [SERVER -> CLIENT]
message SetActiveEffectReply {
  uint64 command_id = 1;
  string error = 2;
}

// [CLIENT -> SERVER]
message UnsetActiveEffect {
  uint64 command_id = 1;
  string effect_id = 2;  // Removing an absent ID does nothing.
}

// [SERVER -> CLIENT]
message UnsetActiveEffectReply {
  uint64 command_id = 1;
  string error = 2;
}

// [CLIENT -> SERVER]
// Starfire interpolates musical position between updates, independently of animation speed.
message UpdateBeat {
  uint64 command_id = 1;
  double position_beats = 2;
  double tempo_bpm = 3;
}

// [SERVER -> CLIENT]
message UpdateBeatReply {
  uint64 command_id = 1;
  string error = 2;
}

// [CLIENT -> SERVER]
message SetParameter {
  uint64 command_id = 1;
  Parameter parameter = 2;  // One global setting; other values remain unchanged.
}

// [SERVER -> CLIENT]
message SetParameterReply {
  uint64 command_id = 1;
  string error = 2;
}

// [CLIENT -> SERVER] [SERVER -> CLIENT]
message Heartbeat {
  uint64 command_id = 1;  // Zero for unsolicited server heartbeats; otherwise echo client ID.
}

// [SERVER -> CLIENT]
message Metrics {
  double elapsed_seconds = 1;
  uint64 rendered_frames = 2;
  uint64 missed_render_deadlines = 3;
  uint32 queued_commands = 4;
  double last_render_duration_seconds = 5;
  string active_bank = 6;
  string active_sequence = 7;
  string script_error = 8;
  string runtime_error = 9;
}

// Shared by initialization and runtime updates. Independent of the active sequence.
message Parameter {
  ParameterType type = 1;
  oneof value {
    double number = 2;
    bool boolean = 3;
  }
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  OUTPUT_BRIGHTNESS = 1;     // Number, 0..1; final output multiplier.
  ANIMATION_SPEED = 2;       // Number, 0..8; independent of beat phase.
  OUTPUT_BLACKOUT = 3;       // Boolean; final darkness gate.
  AUDIO_RMS_NORMALIZED = 4;  // Number, 0..1; missing measurements remain unknown.
}

message RgbColor {
  double red = 1;  // Each channel is normalized to 0..1.
  double green = 2;
  double blue = 3;
}
