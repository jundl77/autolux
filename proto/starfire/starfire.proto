syntax = "proto3";

package autolux.starfire;

// CLIENT = Autolux coordinator; SERVER = its owned Starfire process.
// Framing: four-byte big-endian length, then Protobuf; at most 64 KiB.
// Login is first. Commands apply in order at a render boundary after login.
// Both endpoints exchange heartbeats every 10 seconds; timeout is 30 seconds.

// [CLIENT -> SERVER]
message RendererCommand {
  uint64 command_id = 1;  // Positive, increasing within this process session.
  oneof command {
    Login login = 10;
    PlaySequence play_sequence = 11;
    SetActiveEffect set_active_effect = 12;
    UnsetActiveEffect unset_active_effect = 13;
    UpdateBeat update_beat = 14;
    SetParameter set_parameter = 15;
    Heartbeat heartbeat = 16;
  }
}

// [SERVER -> CLIENT]
message RendererEvent {
  uint64 command_id = 1;  // Reply correlation; zero for unsolicited metrics/heartbeats.
  oneof event {
    LoginReply login_reply = 10;
    PlaySequenceReply play_sequence_reply = 11;
    SetActiveEffectReply set_active_effect_reply = 12;
    UnsetActiveEffectReply unset_active_effect_reply = 13;
    UpdateBeatReply update_beat_reply = 14;
    SetParameterReply set_parameter_reply = 15;
    Heartbeat heartbeat = 16;
    Metrics metrics = 17;
  }
}

// [CLIENT -> SERVER]
// Initialize one owned rendering session. Failure releases acquired resources.
message Login {
  string rig_path = 1;
  string sequences_path = 2;
  string artnet_destination = 3;  // IPv4:port.
  bool broadcast = 4;
  repeated SetParameter parameters = 5;
}

// [SERVER -> CLIENT]
// Empty error means initialization succeeded. Only then may playback begin.
message LoginReply {
  string error = 1;
  uint32 frame_rate_hz = 2;
  uint32 max_message_bytes = 3;
}

// [CLIENT -> SERVER]
// Same identity continues without restart. An absent sequence enters idle:
// clear the baseline and active effects, release strobe and output darkness.
message PlaySequence {
  SequenceReference sequence = 1;
  Transition transition = 2;  // Omitted means cut; idle requires no transition.
}

// [SERVER -> CLIENT]
// Empty error means applied; rejection preserves the previous scene.
message PlaySequenceReply {
  string error = 1;
  SequenceReference sequence = 2;               // Current sequence, absent while idle.
  repeated ParameterDefinition parameters = 3;  // Active Lua program's controls.
}

// [CLIENT -> SERVER]
// Replace this entire identified effect, including its lifetime; baseline continues.
message SetActiveEffect {
  string effect_id = 1;
  FixtureSelection fixtures = 2;
  repeated AttributeAssignment attributes = 3;
  sint32 priority = 4;  // Higher wins; ties use command order.
  EffectLifetime lifetime = 5;
}

// [SERVER -> CLIENT]
message SetActiveEffectReply {
  string error = 1;  // Empty means applied; rejection preserves the prior effect.
}

// [CLIENT -> SERVER]
message UnsetActiveEffect {
  string effect_id = 1;  // Removing an absent ID is a no-op.
}

// [SERVER -> CLIENT]
message UnsetActiveEffectReply {
  string error = 1;
}

// [CLIENT -> SERVER]
// Musical position is interpolated between updates, independently of animation speed.
message UpdateBeat {
  double position_beats = 1;
  double tempo_bpm = 2;
}

// [SERVER -> CLIENT]
message UpdateBeatReply {
  string error = 1;
}

// [CLIENT -> SERVER]
// One typed parameter change; all other settings remain unchanged.
message SetParameter {
  oneof parameter {
    double output_brightness = 1;     // 0..1, final output multiplier.
    double animation_speed = 2;       // 0..8, independent of beat phase.
    bool output_blackout = 3;         // Final gate, after all effects.
    double audio_rms_normalized = 4;  // Measured input, 0..1; absent stays unknown.
    SequenceParameter sequence_parameter = 5;
  }
}

// [SERVER -> CLIENT]
message SetParameterReply {
  string error = 1;
}

// [CLIENT -> SERVER] [SERVER -> CLIENT]
message Heartbeat {}

// [SERVER -> CLIENT]
message Metrics {
  double elapsed_seconds = 1;
  uint64 rendered_frames = 2;
  uint64 missed_render_deadlines = 3;
  uint32 queued_commands = 4;
  double last_render_duration_seconds = 5;
  SequenceReference active_sequence = 6;
  string script_error = 7;
  string runtime_error = 8;
}

// [CLIENT -> SERVER] Presence marker within typed alternatives.
message Empty {}

// [CLIENT -> SERVER] [SERVER -> CLIENT] Shared identity payload.
message SequenceReference {
  string bank_id = 1;
  string sequence_id = 2;  // Unique within its bank.
}

// [CLIENT -> SERVER] Payload within PlaySequence.
message Transition {
  oneof policy {
    Empty cut = 1;
    double crossfade_beats = 2;
  }
}

// [CLIENT -> SERVER] Scripts declare names/types; only the active sequence can change.
message SequenceParameter {
  SequenceReference sequence = 1;
  string name = 2;
  ParameterValue value = 3;
}

// [CLIENT -> SERVER] [SERVER -> CLIENT] Lua controls and fixture attribute values.
message ParameterValue {
  oneof value {
    double number = 1;
    sint64 integer = 2;
    bool boolean = 3;
    string text = 4;
    RgbColor rgb = 5;
  }
}

// [CLIENT -> SERVER] [SERVER -> CLIENT] Each channel is normalized to 0..1.
message RgbColor {
  double red = 1;
  double green = 2;
  double blue = 3;
}

// [CLIENT -> SERVER] Payload within SetActiveEffect.
message FixtureSelection {
  oneof selection {
    Empty all = 1;
    string group_id = 2;
    string fixture_id = 3;
  }
}

// [CLIENT -> SERVER] Payload within SetActiveEffect.
message AttributeAssignment {
  FixtureAttribute attribute = 1;
  ParameterValue value = 2;
  BlendOperation operation = 3;
}

enum FixtureAttribute {
  FIXTURE_ATTRIBUTE_UNSPECIFIED = 0;
  INTENSITY = 1;
  COLOUR = 2;
  PAN = 3;
  TILT = 4;
  STROBE_HZ = 5;
}

enum BlendOperation {
  BLEND_OPERATION_UNSPECIFIED = 0;
  REPLACE = 1;
  MULTIPLY = 2;  // Continuous numeric attributes only; multiplier 0..8.
}

// [CLIENT -> SERVER] Beats accumulate continuously, unaffected by phase corrections.
message EffectLifetime {
  oneof expiration {
    Empty until_removed = 1;
    double duration_beats = 2;
    double duration_seconds = 3;
  }
}

// [SERVER -> CLIENT] Lua parameter metadata within PlaySequenceReply.
message ParameterDefinition {
  string name = 1;
  ValueType value_type = 2;
  ParameterValue default_value = 3;
  string unit = 4;
  ParameterValue minimum = 5;  // Numeric bounds retain the declared type.
  ParameterValue maximum = 6;
  repeated ParameterValue allowed_values = 7;
}

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  NUMBER = 1;
  INTEGER = 2;
  BOOLEAN = 3;
  TEXT = 4;
  RGB = 5;
}
