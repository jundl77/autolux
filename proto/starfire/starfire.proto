syntax = "proto3";

package autolux.starfire;

import "proto/starfire/rig.proto";

// Frame: one byte MessageType, four-byte big-endian payload length, then the standalone
// Protobuf message. LOGIN may use 4 MiB (each lua_source at most 64 KiB); every other type is
// capped at 4 KiB, checked before the payload is read. Login comes first and binds its nonzero
// run_id; command IDs increase. Both ends heartbeat every 10 s; the timeout is 30 s.

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_MINOR = 2;
  PROTOCOL_MAJOR = 3;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  LOGIN_REPLY = 2;
  PLAY_AUTOLOOP = 3;
  ERROR_REPLY = 4;
  SET_ACTIVE_EFFECT = 5;
  UNSET_ACTIVE_EFFECT = 7;
  UPDATE_BEAT = 9;
  SET_PARAMETER = 11;
  HEARTBEAT = 13;
  METRICS = 14;
  DISCARD_DELAYED_AUDIO = 15;
  CUE_SECTION = 17;
  CLEAR_CUES = 18;
}

enum SectionIntent {
  SECTION_INTENT_UNSPECIFIED = 0;
  ATMOSPHERIC = 1;
  BREAKDOWN = 2;
  BUILDUP = 3;
  DROP = 4;
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  OUTPUT_BRIGHTNESS = 1;     // Number, 0..1.
  ANIMATION_SPEED = 2;       // Number, 0..8.
  OUTPUT_BLACKOUT = 3;       // Boolean.
  AUDIO_RMS_NORMALIZED = 4;  // Number, 0..1.
  PAUSED = 5;
  DEFAULT_CROSSFADE_BEATS = 6;
  STROBE_MAX_RATE_HZ = 7;
  STROBE_MAX_BURST_SECONDS = 8;
  PALETTE = 9;
  INTENSITY = 10;
  GROUP_MASTER = 11;  // Number, 0..1, for Parameter.group.
}

message Login {
  uint64 command_id = 1;
  RigDefinition rig = 2;
  repeated AutoloopDefinition autoloops = 3;
  oneof output {
    string artnet_destination = 4;  // IPv4:port.
    RadiusOutput radius = 10;
  }
  repeated Parameter parameters = 6;
  uint32 protocol_major = 7;  // Must match the server's major version.
  uint32 protocol_minor = 8;
  fixed64 run_id = 9;
  optional uint32 render_core = 11;  // Logical CPU index.
  repeated Palette palettes = 12;

  message RadiusOutput {
    string receiver_address = 1;  // IPv4:TCP port.
    string capture_device_id = 2;
    double playback_delay_seconds = 3;
    uint32 receiver_buffer_ms = 4;
    uint32 universe = 5;
    optional uint32 network_core = 6;
    bool receiver_audio_enabled = 8;
    bool receiver_lighting_enabled = 9;
  }
}

message LoginReply {
  uint64 command_id = 1;
  uint32 frame_rate_hz = 3;
  uint32 max_message_bytes = 4;  // Cap for every type except LOGIN.
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;
  fixed64 run_id = 7;
  repeated GroupCapability groups = 8;
}

message GroupCapability {
  string name = 1;
  uint32 cell_count = 2;
  bool colour = 3;
  bool speed = 4;
  bool pulse = 5;
  bool pattern = 6;
  GroupRole role = 7;
  optional StageArea area = 8;  // Set only when every member lies in the same area.
  double centre_x_metres = 9;   // Mean member X in the MVR scene frame.
}

message ErrorReply {
  uint64 command_id = 1;
  string message = 2;
}

message PlayAutoloop {
  uint64 command_id = 1;
  string autoloop_id = 2;  // Empty enters idle: effects cleared, darkness. Every cue is cleared.
  Transition transition = 4;
  string palette = 5;

  message Transition {
    optional double crossfade_beats = 1;  // Absent means cut; otherwise positive.
  }
}

message SetActiveEffect {
  // Physical values use GDTF units; presets name a ChannelSet.
  message AttributeValue {
    oneof value {
      double number = 1;
      string preset = 2;
    }
  }

  uint64 command_id = 1;
  string effect_id = 2;
  oneof target {  // Omitted targets all fixtures.
    string group = 3;
    string fixture = 4;  // A Fixture.fixture_uuid or one of its cell ids, never a name.
  }
  optional double intensity = 5;  // 0..1.
  RgbColor colour = 6;
  optional double pan = 7;                // 0..1.
  optional double tilt = 8;               // 0..1.
  optional double strobe_hz = 9;          // 0..10.
  sint32 priority = 10;                   // Higher wins; ties use command order.
  optional double duration_seconds = 11;  // Positive; absent lasts until unset.
  // GDTF attribute, Geometry.Attribute or full function path.
  map<string, AttributeValue> attributes = 12;
  SpecialFX special_fx = 13;
  bool pan_sweep = 14;  // One soft-limit cycle per 8 s, in place of pan and tilt.
  bool aim_focus = 15;
  FixturePose pose = 16;  // Only for a whole-fixture target.

  // The universe must be one the rig uses, and the profile must keep the fixture's cells.
  message FixturePose {
    repeated double matrix = 1;
    Fixture.MovementRange pan = 2;
    Fixture.MovementRange tilt = 3;
    repeated double focus = 4;
    uint32 universe = 5;
    uint32 address = 6;
    string profile_id = 7;
  }
}

message SpecialFX {
  string colour_slot = 1;  // Active palette slot: "primary", "secondary", "cold", ...
  float energy = 2;        // 0..1.
  float speed = 3;         // 0..1.
  optional uint32 pulse_beats = 4;
  float attack_beats = 5;
  float release_beats = 6;
  optional float pattern = 7;  // 0..1.
}

message UnsetActiveEffect {
  uint64 command_id = 1;
  string effect_id = 2;
  bool instantaneous_release = 3;
}

message DiscardDelayedAudio {
  uint64 command_id = 1;
}

message UpdateBeat {
  uint64 command_id = 1;
  double tempo_bpm = 3;
  uint64 beat_index = 4;
  optional uint32 bar_phase = 5;
  uint32 beats_per_bar = 6;
  BeatFeatures features = 7;
}

// Over the beat that starts at beat_index; each 0..1 against the track's peak.
message BeatFeatures {
  float onset = 1;  // Kick-band (<= 150 Hz) spectral flux.
  float bass = 2;   // 20-150 Hz.
  float mid = 3;    // 150-2500 Hz.
  float high = 4;   // 2500-16000 Hz.
}

// Starts on the first frame at or past start_beat_index; a cue whose start has passed starts on
// the next bar line, its rotation still counted from the true start. A cue drops every pending
// cue starting at or after its start, so cues are sent in start order. At most 4 cues wait.
// A re-sent cue's rows that are already playing carry on.
message CueSection {
  uint64 command_id = 1;
  uint64 start_beat_index = 2;  // An UpdateBeat.beat_index whose bar_phase is 0.
  SectionIntent intent = 3;
  repeated BaseLook rotation = 4;  // 1..8 entries, played in order from the start, then cycled.
  repeated Overlay overlays = 5;   // 0..8.
  string palette = 6;
  optional double drop_strength = 7;  // 0..1, DROP only.
  uint32 seed = 8;

  message BaseLook {
    string autoloop_id = 1;
    uint32 bars = 2;  // At least 1.
    PlayAutoloop.Transition transition = 3;
  }

  // A pre-roll row from the "dip" bank is the blackout before the section: Starfire derives
  // ctx.beats_until_dip and the move in black from that bank name alone.
  message Overlay {
    string autoloop_id = 1;
    sint32 priority = 2;  // Higher composes later; ties keep list order.
    // From the section start. Playing once: -64..1024, negative is pre-roll. Repeating: within the
    // period, and length plus release fit it.
    double begin_beats = 3;
    double length_beats = 4;  // Positive.
    uint32 every_bars = 5;    // 0 plays once.
    double attack_beats = 6;
    double release_beats = 7;
  }
}

// Ends every cue: its overlays release and the base look plays on.
message ClearCues {
  uint64 command_id = 1;
}

message SetParameter {
  uint64 command_id = 1;
  Parameter parameter = 2;
}

message Heartbeat {}

message Metrics {
  double elapsed_seconds = 1;
  uint64 rendered_frames = 2;
  uint64 missed_render_deadlines = 3;
  uint32 queued_commands = 4;
  double last_render_duration_seconds = 5;
  string active_bank = 6;
  string active_autoloop = 7;
  string script_error = 8;
  string runtime_error = 9;
  uint64 last_processed_command_id = 10;  // Includes rejected commands.
  fixed64 run_id = 11;
  uint32 pending_cues = 12;
  string overlay_error = 13;  // At most 256 bytes.
  uint32 active_overlay_count = 14;
}

message AutoloopDefinition {
  string autoloop_id = 1;  // Unique across all banks.
  string bank = 2;
  string lua_source = 3;
  bool intensity_htp = 4;
}

message Parameter {
  ParameterType type = 1;
  oneof value {
    double number = 2;
    bool boolean = 3;
    string text = 5;
  }
  double fade_seconds = 4;
  string group = 6;  // Set only for GROUP_MASTER.
}

message RgbColor {
  double red = 1;  // Each channel 0..1.
  double green = 2;
  double blue = 3;
}

message Palette {
  string name = 1;
  RgbColor primary = 2;
  RgbColor secondary = 3;
  RgbColor accent = 4;
  RgbColor cold = 5;
  RgbColor black = 6;
}
