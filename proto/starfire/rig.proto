syntax = "proto3";

package autolux.starfire;

// Autolux owns and sends the complete patch and the profiles it uses,
// read from an MVR rig (docs/starfire/rig-mvr.md).
message RigDefinition {
  repeated Fixture fixtures = 1;
  repeated FixtureGroup groups = 2;  // MVR classes; members in document order.
  repeated FixtureProfile profiles = 3;
}

message Fixture {
  reserved 7, 8;
  reserved "pan_offset_degrees", "tilt_offset_degrees";

  string fixture_id = 1;  // MVR Fixture name.
  string profile_id = 2;
  uint32 universe = 3;     // Art-Net universe, starting at zero.
  uint32 address = 4;      // DMX address, starting at one.
  MovementRange pan = 5;   // inverted is MVR DMXInvertPan.
  MovementRange tilt = 6;  // inverted is MVR DMXInvertTilt.
  // MVR Matrix: local X, Y and Z axes in scene space, then position in millimetres.
  // Empty means identity. Starfire derives the pan/tilt home from its rotation.
  repeated double matrix = 9;

  message MovementRange {
    optional double minimum = 1;  // Default 0.
    optional double maximum = 2;  // Default 1.
    bool inverted = 3;
  }
}

message FixtureGroup {
  string group_id = 1;
  repeated string fixture_ids = 2;
}

// One standard GDTF fixture type and the selected DMX mode.
// Autolux imports and stores the source; Starfire validates it once during Login.
message FixtureProfile {
  string profile_id = 1;
  string gdtf_xml = 2;  // Complete description.xml, containing exactly one FixtureType.
  string dmx_mode = 3;  // Exact DMXMode name in that definition.
}
