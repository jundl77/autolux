syntax = "proto3";

package autolux.starfire;

// Autolux owns and sends the complete patch and the profiles it uses.
message RigDefinition {
  repeated Fixture fixtures = 1;
  repeated FixtureGroup groups = 2;
  repeated FixtureProfile profiles = 3;
}

message Fixture {
  string fixture_id = 1;
  string profile_id = 2;
  uint32 universe = 3;  // Art-Net universe, starting at zero.
  uint32 address = 4;   // DMX address, starting at one.
  MovementRange pan = 5;
  MovementRange tilt = 6;
  // MVR Matrix: X, Y, Z axes then position in mm; empty is identity.
  repeated double matrix = 9;
  // The mode's channel-owning geometries in order of first offset; empty lets Starfire derive
  // them, otherwise they must match the profile.
  repeated Cell cells = 10;

  // One addressable unit. A single-cell fixture's cell takes the fixture ID; otherwise the
  // cell ID is "fixture_id/geometry".
  message Cell {
    string geometry = 1;
    repeated uint32 offsets = 2;  // One-based offsets within the fixture footprint, ascending.
  }

  message MovementRange {
    optional double minimum = 1;  // Default 0.
    optional double maximum = 2;  // Default 1.
    bool inverted = 3;
  }
}

// Members are fixtures; each contributes all of its cells in offset order.
message FixtureGroup {
  string group_id = 1;
  repeated string fixture_ids = 2;
}

// One GDTF fixture type's selected DMX mode, compiled by Autolux from its description.
// Starfire parses no GDTF; it validates this compiled form once during Login.
message FixtureProfile {
  string profile_id = 1;
  reserved 2;           // Formerly description.xml; Starfire parses no GDTF.
  string dmx_mode = 3;  // The DMXMode name, for diagnostics.
  DmxMode mode = 4;
}

// DMX values are at their channel's resolution, already widened by the GDTF byte rules.
message DmxMode {
  repeated DmxChannel channels = 1;  // In DMXChannels order, referenced geometries expanded.
}

message DmxChannel {
  repeated string geometry_path = 1;       // From the mode's geometry down to the channel's.
  repeated uint32 offsets = 2;             // One-based within the footprint, coarse byte first.
  uint32 default = 3;                      // The initial function's Default.
  repeated ChannelFunction functions = 4;  // Logical channels' functions, in order.
}

message ChannelFunction {
  string path = 1;  // Channel.LogicalChannel.ChannelFunction names.
  string attribute = 2;
  string qualified_attribute = 3;  // Geometry.Attribute.
  uint32 dmx_from = 4;
  double physical_from = 5;
  double physical_to = 6;
  bool snap = 7;
  repeated ChannelSet sets = 8;  // Ascending DMXFrom.
  ModeMaster mode_master = 9;    // Unset when the function is always active.
  // GDTF DMXProfile: output against DMX position; empty is linear.
  repeated DmxProfilePoint dmx_profile = 10;
}

// Output(x) = CFC3·d³ + CFC2·d² + CFC1·d + CFC0 with d = x − dmx_percentage, from the point
// with the greatest dmx_percentage at or below x; x and output are fractions 0..1 of the
// function's DMX range and physical range (GDTF 1.2 Figure 1: 75% is 0,75).
message DmxProfilePoint {
  double dmx_percentage = 1;
  double cfc0 = 2;
  double cfc1 = 3;
  double cfc2 = 4;
  double cfc3 = 5;
}

message ChannelSet {
  string name = 1;
  uint32 dmx_from = 2;
  uint32 dmx_to = 3;
  double physical_from = 4;
  double physical_to = 5;
  CieColor wheel_slot_colour = 6;  // Unset unless the set selects a coloured wheel slot.
}

message ModeMaster {
  uint32 channel = 1;            // Index into DmxMode.channels.
  optional uint32 function = 2;  // Index into that channel's functions; unset for the channel.
  uint32 dmx_from = 3;           // At the master channel's resolution.
  uint32 dmx_to = 4;
}

message CieColor {
  double x = 1;
  double y = 2;
  double luminance = 3;  // Y, 0..100.
}
