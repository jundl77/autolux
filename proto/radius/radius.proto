syntax = "proto3";

package Radius.Bus;
option optimize_for = LITE_RUNTIME;

// CLIENT = radius_tx; SERVER = radius_rx.
// Datagram: one-byte MessageType, four-byte big-endian payload length, then one
// standalone Protobuf message. Total size is at most 1200 bytes; no envelope.
// Login comes first. Major versions must match; minor = min(client, server).
// Only Login has a success reply. Media is best effort and never acknowledged.
// Both endpoints send independent heartbeats every 10 seconds; timeout is 30 seconds.

// Build constants, not a wire field.
// Major changes are incompatible; minor additions are compatible.
enum ProtocolVersion {
  PROTOCOL_MINOR = 0;
  PROTOCOL_MAJOR = 1;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  LOGIN_REPLY = 2;
  ERROR_REPLY = 3;
  AUDIO_FRAME = 4;
  LIGHT_FRAME = 5;
  HEARTBEAT = 6;
  METRICS = 7;
}

// [CLIENT -> SERVER]
// Own one output session. Repeating the identical Login retries its reply without
// restarting output. A changed Login cannot replace an initialized session.
// Device selection and worker affinity remain receiver-local deployment policy.
message Login {
  uint64 command_id = 1;
  fixed64 session_id = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  uint32 sample_rate_hz = 5;  // Supported: 44100.
  uint32 channel_count = 6;   // Supported: 2, left then right.
  bool audio_enabled = 7;
  bool lighting_enabled = 8;
  uint32 jitter_buffer_ms = 9;  // Supported: 20..150.
}

// [SERVER -> CLIENT]
// Output resources are initialized; the client may start media transmission.
message LoginReply {
  uint64 command_id = 1;
  fixed64 session_id = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;  // Negotiated minor version.
  uint32 max_message_bytes = 5;
}

// [SERVER -> CLIENT]
message ErrorReply {
  uint64 command_id = 1;
  fixed64 session_id = 2;
  string message = 3;
}

// [CLIENT -> SERVER]
message AudioFrame {
  fixed64 session_id = 1;
  fixed64 audio_frame_position = 2;  // Session stereo frame index of the first sample.
  fixed32 sequence_number = 3;       // Per media kind; wraps modulo 2^32.
  repeated float interleaved_samples = 4 [packed = true];  // 1..128 finite stereo frames.
}

// [CLIENT -> SERVER]
message LightFrame {
  fixed64 session_id = 1;
  fixed64 audio_frame_position = 2;  // Target audible audio-frame watermark.
  fixed32 sequence_number = 3;
  bytes channels = 4;  // Exactly 512 DMX channel values.
}

// [CLIENT -> SERVER] [SERVER -> CLIENT]
message Heartbeat {
  fixed64 session_id = 1;  // Session routing only; no command ID or echo.
}

// [SERVER -> CLIENT]
// Counters stay integers; optional ages distinguish missing input from zero age.
message Metrics {
  fixed64 session_id = 25;
  uint64 last_processed_command_id = 26;
  bool up = 1;
  bool link_up = 2;
  double heartbeat_age_seconds = 3;
  uint64 heartbeats_sent = 4;
  uint64 heartbeats_received = 5;
  double audio_buffer_seconds = 6;
  double buffer_target_seconds = 7;
  uint64 underruns_total = 8;
  uint64 device_underruns_total = 9;
  uint64 concealed_frames_total = 10;
  uint64 lost_frames_total = 11;
  uint64 overflow_frames_total = 12;
  uint64 late_packets_total = 13;
  uint64 latency_trims_total = 14;
  sint32 clock_correction_ppm = 15;
  bool dmx_connected = 16;
  uint64 dmx_frames_total = 17;  // Complete successful Enttec frame writes, including blackouts.
  uint64 dmx_dropped_total = 18;
  double dmx_lateness_seconds = 19;
  optional double audio_input_age_seconds = 20;
  optional double audio_max_gap_seconds = 21;
  float audio_signal_peak = 22;
  uint64 invalid_packets_total = 23;
  uint64 send_failures_total = 24;
}
