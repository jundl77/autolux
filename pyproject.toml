[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "autolux*"]
exclude = ["*.tests*", "autolux.training.data*"]

[project.scripts]
autolux = "cli.main:run_sync"

[project]
name = "autolux"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-rtmidi>=1.5,<2",
    "cython",
    "madmom",
    "numpy>=1.26,<2",
    "pyaudio",
    "scipy",
    "python-osc",
    "scikit-learn",
    "librosa",
    "argcomplete",
    "zeroconf",
    "netifaces",
    "prometheus-client>=0.21,<1",
    "setuptools<71",
    # torch stays at 2.11: only the legacy TorchScript ONNX exporter keeps a GRU's
    # time axis dynamic, and it is deprecated from 2.9. Pin provenance is the PR body.
    "torch>=2.11,<2.12",
    "transformers>=4.57,<5",
    "onnxruntime>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jupyterlab",
    # The downbeat tests export ONNX graphs; without it they fail to collect.
    "onnx>=1.22,<2",
    "ruff==0.17.2",
    "clang-format==23.1.3",
    "pre-commit>=4.7.0",
]
visualizer = [
    "dash>=2.14",
    "sounddevice",
]
# Training the acoustic model only -- the show imports nn.decoder, so training/nn/
# is not offline-only. torch and onnxruntime are base deps and are not repeated here.
training = [
    "onnx>=1.22,<2",
    "tensorboard>=2.16",
    # tensorboard's image summaries encode through PIL, which tensorboard does not
    # require; without it the per-epoch confusion matrix raises an hour into a run.
    "pillow>=10",
]

# `explicit = true` is load-bearing: without it uv consults this index for every
# package and shadows PyPI with an incomplete mirror.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
link-mode = "copy"
# Removing this breaks `uv lock`: uv resolves universally, and on py3.13 ml-dtypes
# (via onnx) demands numpy>=2.1 against this project's numpy<2 pin.
environments = ["sys_platform == 'win32' and python_full_version < '3.12'"]
# madmom builds from a SHA because no release imports on py3.10+, and from this
# environment's numpy ABI because the Cython build links against it.
no-build-isolation-package = ["madmom"]
extra-build-dependencies = { madmom = ["cython", "numpy>=1.26,<2", "setuptools<71"] }

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
madmom = { git = "https://github.com/CPJKU/madmom.git", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["autolux/tests", "cli/tests", "radius/tests"]
pythonpath = ["."]
markers = [
    "integration: full-pipeline simulation tests (slow, requires madmom)",
]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py311"
line-length = 100
extend-exclude = ["autolux/training/data", "radius/x_*", "radius/cmake-build-*"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
